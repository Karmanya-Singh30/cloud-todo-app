{% extends "base.html" %}
{% block title %}{{ error.code }} {{ error.name }} | Cloud To-Do{% endblock %}
{% block content %}
    <section class="panel error-page">
      <p class="eyebrow">ERROR {{ error.code }}</p>
      <h1>{{ error.name }}</h1>
      <p class="subtitle">{{ error.description }}</p>
      <a class="primary-link" href="{{ url_for('index') }}">Back to your tasks</a>
    </section>
{% endblock %}
